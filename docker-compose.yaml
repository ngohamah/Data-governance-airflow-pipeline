# Minimal Airflow stack for this project: LocalExecutor + Postgres metadata DB.
# No Celery/Redis/worker/flower — LocalExecutor runs tasks in-process on the
# scheduler, which is all a single linear DAG on one CSV needs (see
# implementationmap.md section 6, item 3).

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__FERNET_KEY: ""
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:-}
  AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:-587}
  AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:-}
  AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-airflow-alerts@example.com}
  AIRFLOW__SMTP__SMTP_STARTTLS: "true"
  AIRFLOW__SMTP__SMTP_SSL: "false"
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  PYTHONPATH: /opt/airflow

x-airflow-common-volumes: &airflow-common-volumes
  - ./dags:/opt/airflow/dags
  - ./src:/opt/airflow/src
  - ./data:/opt/airflow/data
  - ./reports:/opt/airflow/reports
  - ./logs:/opt/airflow/logs
  - ./plugins:/opt/airflow/plugins

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Air --lastname Flow \
          --role Admin --email admin@example.com || true
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    build: .
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume:
